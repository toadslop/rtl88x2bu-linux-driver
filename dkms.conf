PACKAGE_NAME="rtl88x2bu"
PACKAGE_VERSION="@PKGVER@"
# Prefer pacman rustc (/usr/bin) over rustup; set LIBCLANG_PATH for bindgen if invoked.
MAKE[0]="env PATH=/usr/bin:/bin LIBCLANG_PATH=/usr/lib make -j$(nproc) KVER=${kernelver} KSRC=/lib/modules/${kernelver}/build"
CLEAN="make clean"
BUILT_MODULE_NAME[0]="88x2bu"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless"
AUTOINSTALL="yes"
