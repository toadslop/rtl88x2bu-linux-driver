PACKAGE_NAME="rtl88x2bu"
PACKAGE_VERSION="@PKGVER@"
# @MAKE_ENV@ is replaced by scripts/install-dkms.sh on Arch (PATH/LIBCLANG_PATH).
# Ubuntu/Debian: leave empty; set LLVM=1 and LIBCLANG_PATH per dev-environment.md.
MAKE[0]="@MAKE_ENV@make -j$(nproc) KVER=${kernelver} KSRC=/lib/modules/${kernelver}/build"
CLEAN="make clean"
BUILT_MODULE_NAME[0]="88x2bu"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless"
AUTOINSTALL="yes"
