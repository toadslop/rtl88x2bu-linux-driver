name: "RTL88x2BU CodeQL"

# Read by GitHub default CodeQL setup when present at this path.
# See https://docs.github.com/en/code-security/code-scanning/managing-your-code-scanning-configuration/editing-your-configuration-of-code-scanning

queries:
  - uses: security-and-quality

# cpp/weak-cryptographic-algorithm — legacy 802.11 WEP/TKIP RC4 (IEEE 802.11-1999/2003).
#
# This driver retains WEP40/WEP104/TKIP RC4 primitives for interoperability with
# peers that still require those legacy ciphers. WEP is cryptographically broken by
# design; it is not chosen for new security modes. Modern associations use
# AES/CCMP/GCMP (ported to Rust under rust/).
#
# The alert surfaces in core/rtw_security.c (non-Rust builds) and
# core/rtw_security_rest.c (CONFIG_RUST split, W3-04). In-code markers use
# RTW_CODEQL_SUPPRESS_WEAK_RC4 before each arcfour_* call site.
query-filters:
  - exclude:
      id: cpp/weak-cryptographic-algorithm
