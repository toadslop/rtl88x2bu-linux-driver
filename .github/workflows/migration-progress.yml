# Post Rust migration progress summary on pull requests.
# Derives the 88x2bu link set from L0 builds (no committed object list).
# See scripts/ci/run-migration-progress-ci.sh

name: Migration progress

on:
  pull_request:

env:
  KERNEL_TAG: v6.12.9
  L0_IMAGE: ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:v6.12.9

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  migration-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published L0 image
        id: pull
        continue-on-error: true
        run: docker pull "${L0_IMAGE}"

      - name: Build L0 image (fallback when ghcr tag is missing)
        if: steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          load: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: rtl88x2bu-l0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute progress report
        id: report
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE="${L0_IMAGE}"
          else
            IMAGE="rtl88x2bu-l0:ci"
          fi
          BODY="$(docker run --rm -v "$PWD:/driver" -w /driver "${IMAGE}" \
            ./scripts/ci/run-migration-progress-ci.sh "${BASE_REF}")"
          {
            echo 'body<<EOF'
            echo "${BODY}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Post PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          comment-id: find
          body: ${{ steps.report.outputs.body }}
          header: migration-progress
