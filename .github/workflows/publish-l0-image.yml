# T6a: Build and publish the L0 CI container image to ghcr.io.
# See docs/rust-migration/issues/test-06-ci-l0-build.md

name: Publish L0 CI image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/docker/l0/**'
      - 'scripts/ci/build-pinned-kernel.sh'
      - '.github/workflows/publish-l0-image.yml'

env:
  KERNEL_TAG: v6.12.9

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push L0 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          push: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:${{ env.KERNEL_TAG }}
            ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:latest
