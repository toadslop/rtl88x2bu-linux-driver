# T22: non-default config build matrix in the L0 container (advisory).
# See docs/rust-migration/issues/test-22-ci-config-matrix.md

name: Module L0 config matrix

on:
  push:
    branches: [master]
    paths:
      - 'Makefile'
      - 'include/**'
      - 'core/**'
      - 'hal/**'
      - 'os_dep/**'
      - 'platform/**'
      - 'rust/**'
      - '.github/workflows/module-l0-matrix.yml'
      - 'scripts/ci/l0-config-matrix.sh'
  pull_request:

env:
  KERNEL_TAG: v6.12.9
  L0_IMAGE: ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:v6.12.9

jobs:
  module-l0-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            matrix:
              - 'Makefile'
              - 'include/**'
              - 'core/**'
              - 'hal/**'
              - 'os_dep/**'
              - 'platform/**'
              - 'rust/**'
              - '.github/workflows/module-l0-matrix.yml'
              - 'scripts/ci/l0-config-matrix.sh'

      - name: Out of scope — skip matrix
        if: steps.filter.outputs.matrix != 'true'
        run: echo "PR does not touch config-matrix paths — reporting success without build"

      - name: Log in to ghcr.io
        if: steps.filter.outputs.matrix == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published L0 image
        if: steps.filter.outputs.matrix == 'true'
        id: pull
        continue-on-error: true
        run: docker pull "${L0_IMAGE}"

      - name: Build L0 image (fallback when ghcr tag is missing)
        if: steps.filter.outputs.matrix == 'true' && steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          load: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: rtl88x2bu-l0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Non-default config matrix (advisory)
        if: steps.filter.outputs.matrix == 'true'
        continue-on-error: true
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE="${L0_IMAGE}"
          else
            IMAGE="rtl88x2bu-l0:ci"
          fi
          docker run --rm -v "$PWD:/driver" -w /driver "${IMAGE}" \
            bash -c "export LIBCLANG_PATH=/usr/lib/llvm-18/lib && chmod +x ./scripts/ci/l0-config-matrix.sh && ./scripts/ci/l0-config-matrix.sh"
