# T6b: L0 module build gate on pull requests (pinned Rust kernel).
# T10: pull_request always triggers; job-level paths-filter skips out-of-scope PRs.
# See docs/rust-migration/issues/test-06-ci-l0-build.md

name: Module L0 build

on:
  push:
    branches: [master]
    paths:
      - 'core/**'
      - 'hal/**'
      - 'os_dep/**'
      - 'include/**'
      - 'platform/**'
      - 'rust/**'
      - 'Makefile'
      - 'dkms.conf'
      - '.github/workflows/module-l0.yml'
      - 'scripts/ci/verify-ko-probes.sh'
  pull_request:

env:
  KERNEL_TAG: v6.12.9
  L0_IMAGE: ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:v6.12.9

jobs:
  module-l0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            l0:
              - 'core/**'
              - 'hal/**'
              - 'os_dep/**'
              - 'include/**'
              - 'platform/**'
              - 'rust/**'
              - 'Makefile'
              - 'dkms.conf'
              - '.github/workflows/module-l0.yml'
              - 'scripts/ci/verify-ko-probes.sh'

      - name: Out of scope — skip L0
        if: steps.filter.outputs.l0 != 'true'
        run: echo "PR does not touch L0 paths — reporting success without build"

      - name: Log in to ghcr.io
        if: steps.filter.outputs.l0 == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published L0 image
        if: steps.filter.outputs.l0 == 'true'
        id: pull
        continue-on-error: true
        run: docker pull "${L0_IMAGE}"

      - name: Build L0 image (fallback when ghcr tag is missing)
        if: steps.filter.outputs.l0 == 'true' && steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          load: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: rtl88x2bu-l0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: L0 build and probe verify
        if: steps.filter.outputs.l0 == 'true'
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE="${L0_IMAGE}"
          else
            IMAGE="rtl88x2bu-l0:ci"
          fi
          docker run --rm -v "$PWD:/driver" -w /driver "${IMAGE}" \
            bash -c 'make clean && make KDIR=/opt/linux LLVM=1 -j"$(nproc)" && ./scripts/ci/verify-ko-probes.sh 88x2bu.ko'
