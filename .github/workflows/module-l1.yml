# T7: L1 symbol/ABI gate on pull requests (pinned Rust kernel).
# T10: pull_request always triggers; job-level paths-filter skips out-of-scope PRs.
# See docs/rust-migration/issues/test-07-ci-l1-symbols.md

name: Module L1 symbols

on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'Makefile'
      - 'docs/rust-migration/scripts/**'
      - 'scripts/ci/**'
      - '.github/workflows/module-l1.yml'
  pull_request:

env:
  KERNEL_TAG: v6.12.9
  L0_IMAGE: ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:v6.12.9

jobs:
  module-l1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            l1:
              - 'rust/**'
              - 'Makefile'
              - 'docs/rust-migration/scripts/**'
              - 'scripts/ci/**'
              - '.github/workflows/module-l1.yml'

      - name: Out of scope — skip L1
        if: steps.filter.outputs.l1 != 'true'
        run: echo "PR does not touch L1 paths — reporting success without symbol checks"

      - name: Select L1 unit targets from diff
        if: steps.filter.outputs.l1 == 'true'
        id: l1_scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            else
              BASE="${BEFORE}"
            fi
          fi
          TARGETS=$(./scripts/ci/l1-targets-from-diff.sh "${BASE}")
          echo "L1 unit targets: ${TARGETS}"
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

      - name: Log in to ghcr.io
        if: steps.filter.outputs.l1 == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published L0 image
        if: steps.filter.outputs.l1 == 'true'
        id: pull
        continue-on-error: true
        run: docker pull "${L0_IMAGE}"

      - name: Build L0 image (fallback when ghcr tag is missing)
        if: steps.filter.outputs.l1 == 'true' && steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          load: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: rtl88x2bu-l0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip L1 — no symbol-relevant paths in diff
        if: steps.filter.outputs.l1 == 'true' && steps.l1_scope.outputs.targets == ''
        run: echo "No L1 unit targets in diff scope — skip symbol checks"

      - name: L1 symbol checks
        if: steps.filter.outputs.l1 == 'true' && steps.l1_scope.outputs.targets != ''
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE="${L0_IMAGE}"
          else
            IMAGE="rtl88x2bu-l0:ci"
          fi
          TARGETS="${{ steps.l1_scope.outputs.targets }}"
          docker run --rm -v "$PWD:/driver" -w /driver "${IMAGE}" \
            bash -c "make KDIR=/opt/linux LLVM=1 rust-check-symbols-selftest && ./scripts/ci/run-l1-unit-checks.sh ${TARGETS}"
