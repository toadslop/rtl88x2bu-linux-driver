# R1: Weekly DKMS source tarball GitHub Release from tip of master.
# See docs/release.md and docs/rust-migration/issues/release-01-github-releases.md
#
# Cadence: weekly during the C→Rust migration (Wave 0+). Switch back to
# per-merge (workflow_run on Module L0) once the Rust driver is complete and
# releases are mainly refactoring / performance improvements.

name: DKMS release

on:
  schedule:
    # Mondays 06:00 UTC — one snapshot per week while migration is incomplete.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build tarball only (upload artifact, no GitHub Release)
        type: boolean
        default: true

permissions:
  contents: write

env:
  KERNEL_TAG: v6.12.9
  L0_IMAGE: ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:v6.12.9

jobs:
  verify-l0:
    name: Module L0 (release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published L0 image
        id: pull
        continue-on-error: true
        run: docker pull "${L0_IMAGE}"

      - name: Build L0 image (fallback when ghcr tag is missing)
        if: steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          load: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: rtl88x2bu-l0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bindgen freshness + L0 build and probe verify
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE="${L0_IMAGE}"
          else
            IMAGE="rtl88x2bu-l0:ci"
          fi
          docker run --rm -v "$PWD:/driver" -w /driver "${IMAGE}" \
            bash -c 'KDIR=/opt/linux ./scripts/bindgen_rtw.sh --check && make clean && make KDIR=/opt/linux LLVM=1 -j"$(nproc)" && ./scripts/ci/verify-ko-probes.sh 88x2bu.ko'

  release:
    needs: verify-l0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Skip when this commit was already released
        id: skip
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          # Tags are v5.13.1.migration.<date>.<shortsha>
          if gh release list --limit 100 --json tagName \
            --jq "map(.tagName)[]" | grep -qE "\.${SHORT_SHA}$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${SHORT_SHA} already has a GitHub Release — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package DKMS tarball
        id: pkg
        run: |
          chmod +x scripts/ci/package-dkms-release.sh
          ./scripts/ci/package-dkms-release.sh

      - name: Upload tarball artifact
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dkms-tarball
          path: ${{ steps.pkg.outputs.tarball }}

      - name: Create GitHub prerelease
        if: >-
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) &&
          steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          VER="${{ steps.pkg.outputs.version }}"
          TARBALL="${{ steps.pkg.outputs.tarball }}"
          SHA="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
            exit 0
          fi
          gh release create "$TAG" "$TARBALL" \
            --prerelease \
            --title "DKMS ${VER}" \
            --notes "**Reviewer:** @toadslop

          Weekly DKMS source release for commit \`${SHA}\` (tip of \`master\`).

          - **Artifact:** \`$(basename "$TARBALL")\`
          - **Requires:** \`CONFIG_RUST=y\` kernel headers; see [dev-environment.md](https://github.com/${{ github.repository }}/blob/master/docs/rust-migration/dev-environment.md)
          - **Packaging:** [docs/release.md](https://github.com/${{ github.repository }}/blob/master/docs/release.md)
          - **Hardware smoke:** [docs/smoke-test.md](https://github.com/${{ github.repository }}/blob/master/docs/smoke-test.md)

          Cadence: weekly while the C→Rust migration is incomplete; this workflow runs Module L0 inline before packaging."
