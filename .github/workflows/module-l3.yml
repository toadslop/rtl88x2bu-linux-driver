# T8: L3 module load/unload gate on master merges (pinned Rust kernel + QEMU TCG).
# See docs/rust-migration/issues/test-08-ci-l3-qemu.md

name: Module L3 load

on:
  push:
    branches: [master]
    paths:
      - 'core/**'
      - 'hal/**'
      - 'os_dep/**'
      - 'include/**'
      - 'platform/**'
      - 'rust/**'
      - 'Makefile'
      - 'dkms.conf'
      - '.github/docker/l0/**'
      - '.github/workflows/module-l3.yml'
      - 'scripts/ci/build-l3-initrd.sh'
      - 'scripts/ci/run-l3-qemu.sh'
      - 'scripts/ci/verify-ko-probes.sh'

env:
  KERNEL_TAG: v6.12.9
  L0_IMAGE: ghcr.io/${{ github.repository_owner }}/rtl88x2bu-l0:v6.12.9

jobs:
  module-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published L0 image
        id: pull
        continue-on-error: true
        run: docker pull "${L0_IMAGE}"

      - name: Build L0 image (fallback when ghcr tag is missing)
        if: steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/l0/Dockerfile
          load: true
          build-args: |
            KERNEL_TAG=${{ env.KERNEL_TAG }}
          tags: rtl88x2bu-l0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: L3 build and QEMU insmod/rmmod
        id: l3
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            IMAGE="${L0_IMAGE}"
          else
            IMAGE="rtl88x2bu-l0:ci"
          fi
          docker run --rm -v "$PWD:/driver" -w /driver "${IMAGE}" \
            bash -c 'set -euo pipefail
              make clean
              make KDIR=/opt/linux LLVM=1 -j"$(nproc)"
              ./scripts/ci/run-l3-qemu.sh --ko 88x2bu.ko --log /tmp/l3-serial.log
              cp /tmp/l3-serial.log /driver/l3-serial.log'

      - name: Upload L3 serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: l3-serial-log
          path: l3-serial.log
          if-no-files-found: ignore
