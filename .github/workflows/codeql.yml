# Advanced CodeQL setup for RTL88x2BU.
#
# Default Setup ignores .github/codeql/codeql-config.yml (including query-filters
# and paths-ignore for C/C++ manual builds). This workflow loads the committed
# config and filters host L2 oracle false positives before SARIF upload.
#
# After merging, disable Default Setup under Settings → Code security → CodeQL
# analysis to avoid duplicate scans and a redundant failing PR check.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            sarif: actions
          - language: c-cpp
            sarif: c-cpp
          - language: rust
            sarif: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        if: matrix.language == 'c-cpp' || matrix.language == 'rust'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: never

      - name: Filter host L2 WEP oracle false positives
        if: matrix.language == 'c-cpp'
        uses: advanced-security/filter-sarif@v1.1
        with:
          patterns: |
            -tests/host/**:cpp/weak-cryptographic-algorithm
          input: sarif-results/${{ matrix.sarif }}.sarif
          output: sarif-results/${{ matrix.sarif }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/${{ matrix.sarif }}.sarif
          category: /language:${{ matrix.language }}
