# Advanced CodeQL setup loads .github/codeql/codeql-config.yml (default setup ignores it).
# C++ uses source-only extraction (no kernel module build on the GitHub runner).
# See codeql-config.yml for cpp/weak-cryptographic-algorithm exclusion rationale.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
          output: sarif-results

      - name: Dismiss suppressed alerts
        uses: advanced-security/dismiss-alerts@v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/cpp.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
