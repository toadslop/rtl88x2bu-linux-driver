# T16: rustfmt --check on rust/** changes.
# T20: advisory clippy on rust/** (non-blocking job).
# See docs/rust-migration/issues/test-16-ci-rustfmt.md, test-20-ci-clippy-warn.md

name: Rust lint

on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'include/osdep_service.h'
      - 'scripts/ci/rustfmt-check.sh'
      - 'scripts/ci/clippy-check.sh'
      - 'scripts/ci/check-status-constants.sh'
      - 'scripts/ci/check-rust-cfg-parity.sh'
      - 'scripts/ci/rust-cfg-default.golden'
      - 'scripts/rust_cfgs.sh'
      - 'scripts/rust_cfgs.d/**'
      - '.github/workflows/rust-lint.yml'
  pull_request:

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.83.0
    steps:
      - uses: actions/checkout@v4

      # Cheap and dependency-free, so it runs on every PR: _SUCCESS/_FAIL in a
      # Rust port are ABI shared with the remaining C call sites.
      - name: Status constants match osdep_service.h
        run: ./scripts/ci/check-status-constants.sh

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'scripts/ci/rustfmt-check.sh'
              - 'scripts/ci/clippy-check.sh'
              - '.github/workflows/rust-lint.yml'

      - name: Out of scope — skip rustfmt
        if: steps.filter.outputs.rust != 'true'
        run: echo "PR does not touch rust/** — reporting success without rustfmt"

      - name: Install rustfmt
        if: steps.filter.outputs.rust == 'true'
        run: rustup toolchain install 1.83.0 --profile minimal --component rustfmt

      - name: rustfmt --check (rust/**)
        if: steps.filter.outputs.rust == 'true'
        run: ./scripts/ci/rustfmt-check.sh

  rust-cfg-parity:
    name: Rust cfg parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            driver_build:
              - 'Makefile'
              - 'rust/**'
              - 'scripts/rust_cfgs.sh'
              - 'scripts/rust_cfgs.d/**'
              - 'scripts/ci/check-rust-cfg-parity.sh'
      - 'scripts/ci/rust-cfg-default.golden'
              - '.github/workflows/rust-lint.yml'

      - name: Out of scope — skip cfg parity
        if: steps.filter.outputs.driver_build != 'true'
        run: echo "PR does not touch Rust cfg wiring — reporting success without cfg parity"

      - name: check-rust-cfg-parity.sh (needs module-l0 image)
        if: steps.filter.outputs.driver_build == 'true'
        run: |
          if [ ! -d /opt/linux ]; then
            echo "rust-lint runner has no pinned KDIR; cfg parity is exercised by module-l0 on PRs."
            exit 0
          fi
          make clean
          make KDIR=/opt/linux LLVM=1 LIBCLANG_PATH=/usr/lib/llvm-18/lib -j"$(nproc)"
          ./scripts/ci/check-rust-cfg-parity.sh

  clippy-advisory:
    name: Rust clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: 1.83.0
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'scripts/ci/clippy-check.sh'
              - '.github/workflows/rust-lint.yml'

      - name: Out of scope — skip clippy
        if: steps.filter.outputs.rust != 'true'
        run: echo "PR does not touch rust/** — reporting success without clippy"

      - name: Install clippy
        if: steps.filter.outputs.rust == 'true'
        run: rustup toolchain install 1.83.0 --profile minimal --component clippy

      - name: clippy advisory (rust/**)
        if: steps.filter.outputs.rust == 'true'
        run: ./scripts/ci/clippy-check.sh
